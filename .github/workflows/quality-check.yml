name: Code Quality Sentinel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze-and-report:
    runs-on: ubuntu-latest

    steps:
    - name: Sjekk ut kildekode
      uses: actions/checkout@v4

    - name: Bygg Sentinel-analysatoren (Docker)
      run: docker build -f infrastructure/Dockerfile -t code-quality-sentinel .

    - name: Kjør Sentinel-analysatoren (Docker)
      run: docker run --name sentinel-run -v ${{ github.workspace }}:/source code-quality-sentinel

    - name: Kopier ut den genererte rapporten fra containeren
      run: |
        mkdir -p dist
        docker cp sentinel-run:/app/app/output/. ./dist/

    - name: Last opp visuell rapport som artifakt
      uses: actions/upload-artifact@v4
      with:
        name: code-quality-report
        path: ./dist/
        retention-days: 7